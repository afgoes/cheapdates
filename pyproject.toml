[project]
name = "cheapdates"
version = "0.3.0"
description = "Flight calendars, itinerary search, airline filters and optional fare comparison. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "playwright>=1.45",
  "fast-flights>=3.1,<4",
  "primp>=1.3.1,<2",
  "selectolax>=0.4,<0.5",
  "pydantic>=2,<3",
  "typing_extensions",
  "typer>=0.12",
  "mcp>=1.2",
]

[project.scripts]
cheapdates = "cheapdates.cli:app"
cheapdates-mcp = "cheapdates.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cheapdates"]

[dependency-groups]
dev = ["pytest"]
